apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard
spec:
  serviceName: shard
  replicas: 3
  selector:
    matchLabels:
      app: duck-shard
  template:
    metadata:
      labels:
        app: duck-shard
    spec:
      containers:
        - name: shard
          image: ducksharding-shard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Database__FileName
              value: "/data/shard.db"  # Changed back to /data
          volumeMounts:
            - name: data
              mountPath: /data  # Changed back to /data (not /app!)
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: shard
spec:
  clusterIP: None
  selector:
    app: duck-shard
  ports:
    - port: 8080
      targetPort: 8080