apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'coordinator'
        static_configs:
          - targets: ['coordinator:8080']
            labels:
              service: 'coordinator'

      - job_name: 'shard-leaders'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_role]
            action: keep
            regex: leader
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:8080

      - job_name: 'shard-followers'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_role]
            action: keep
            regex: follower
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:8080

  alerts.yml: |
    groups:
      - name: ducksharding_alerts
        interval: 30s
        rules:
          # High P99 Latency Alert
          - alert: HighP99Latency
            expr: histogram_quantile(0.99, rate(coordinator_request_duration_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High P99 latency detected"
              description: "P99 latency is {{ $value }}s (threshold: 1s) for operation {{ $labels.operation }}"

          # Critical P99 Latency Alert
          - alert: CriticalP99Latency
            expr: histogram_quantile(0.99, rate(coordinator_request_duration_seconds_bucket[5m])) > 5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Critical P99 latency detected"
              description: "P99 latency is {{ $value }}s (threshold: 5s) for operation {{ $labels.operation }}"

          # Replication Lag Alert
          - alert: HighReplicationLag
            expr: shard_replication_lag_seconds > 30
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High replication lag detected"
              description: "Replication lag is {{ $value }}s (threshold: 30s) for shard {{ $labels.shard_id }}, replica {{ $labels.replica_id }}"

          # Critical Replication Lag Alert
          - alert: CriticalReplicationLag
            expr: shard_replication_lag_seconds > 120
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Critical replication lag detected"
              description: "Replication lag is {{ $value }}s (threshold: 120s) for shard {{ $labels.shard_id }}, replica {{ $labels.replica_id }}"

          # Shard Down Alert
          - alert: ShardDown
            expr: up{job=~"shard-.*"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Shard is down"
              description: "Shard {{ $labels.instance }} has been down for more than 1 minute"

          # Coordinator Down Alert
          - alert: CoordinatorDown
            expr: up{job="coordinator"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Coordinator is down"
              description: "Coordinator has been down for more than 1 minute"

          # High Error Rate Alert
          - alert: HighErrorRate
            expr: rate(coordinator_requests_total{status=~"error|.*_error"}[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value }} req/s for operation {{ $labels.operation }}"

          # Replication Sequence Gap Alert
          - alert: ReplicationSequenceGap
            expr: rate(shard_replication_gaps_total[5m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Replication sequence gaps detected"
              description: "Sequence gaps detected for shard {{ $labels.shard_id }}, replica {{ $labels.replica_id }}"

          # RabbitMQ Consumer Error Alert
          - alert: RabbitMQConsumerErrors
            expr: rate(rabbitmq_messages_consumed_total{status="error"}[5m]) > 0.01
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "RabbitMQ consumer errors detected"
              description: "Consumer errors for queue {{ $labels.queue }}, shard {{ $labels.shard_id }}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical'
          continue: true
        - match:
            severity: warning
          receiver: 'warning'

    receivers:
      - name: 'default'
        webhook_configs:
          - url: 'http://localhost:5001/webhook'
            send_resolved: true

      - name: 'critical'
        webhook_configs:
          - url: 'http://localhost:5001/webhook/critical'
            send_resolved: true

      - name: 'warning'
        webhook_configs:
          - url: 'http://localhost:5001/webhook/warning'
            send_resolved: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
            - name: alertmanager-storage
              mountPath: /alertmanager
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
        - name: alertmanager-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  type: NodePort
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
      nodePort: 30093

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'DuckSharding'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-main
data:
  ducksharding-main.json: |
    {
      "dashboard": {
        "title": "DuckSharding Cluster Overview",
        "panels": [
          {
            "title": "Request Latency (P50, P95, P99)",
            "targets": [
              {
                "expr": "histogram_quantile(0.50, rate(coordinator_request_duration_seconds_bucket[5m]))",
                "legendFormat": "P50"
              },
              {
                "expr": "histogram_quantile(0.95, rate(coordinator_request_duration_seconds_bucket[5m]))",
                "legendFormat": "P95"
              },
              {
                "expr": "histogram_quantile(0.99, rate(coordinator_request_duration_seconds_bucket[5m]))",
                "legendFormat": "P99"
              }
            ],
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "title": "Request Throughput",
            "targets": [
              {
                "expr": "rate(coordinator_requests_total[5m])",
                "legendFormat": "{{operation}}"
              }
            ],
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "title": "Error Rate",
            "targets": [
              {
                "expr": "rate(coordinator_requests_total{status=~\".*error.*\"}[5m])",
                "legendFormat": "{{operation}} - {{status}}"
              }
            ],
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "title": "Replication Lag",
            "targets": [
              {
                "expr": "shard_replication_lag_seconds",
                "legendFormat": "{{shard_id}} - {{replica_id}}"
              }
            ],
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "title": "Cluster Health",
            "targets": [
              {
                "expr": "coordinator_shards_healthy / coordinator_total_shards * 100",
                "legendFormat": "Health %"
              }
            ],
            "type": "gauge",
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 16}
          },
          {
            "title": "Replication Events",
            "targets": [
              {
                "expr": "rate(shard_replication_events_total[5m])",
                "legendFormat": "{{shard_id}} - {{operation}}"
              }
            ],
            "type": "graph",
            "gridPos": {"h": 8, "w": 18, "x": 6, "y": 16}
          }
        ],
        "refresh": "10s",
        "schemaVersion": 16,
        "version": 0
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard-main
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: grafana-dashboard-main
          configMap:
            name: grafana-dashboard-main
        - name: grafana-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300