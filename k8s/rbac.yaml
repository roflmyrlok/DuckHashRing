apiVersion: v1
kind: ServiceAccount
metadata:
  name: coordinator-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coordinator-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "delete", "get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coordinator-rolebinding
subjects:
- kind: ServiceAccount
  name: coordinator-sa
roleRef:
  kind: Role
  name: coordinator-role
  apiGroup: rbac.authorization.k8s.io
